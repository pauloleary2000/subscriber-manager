<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — IPTV Subscriber Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white rounded-xl shadow-lg border border-slate-200 max-w-sm w-full p-6 space-y-5">
        <div>
            <h1 class="text-xl font-bold text-slate-900">Subscriber Manager</h1>
            <p class="text-xs text-slate-500 mt-1">Sign in to manage subscribers, XUI renewals, and backups.</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="space-y-2">
              {% for category, msg in messages %}
                <div class="p-3 rounded-lg text-xs font-medium {{ 'bg-red-50 text-red-800 border border-red-200' if category in ('error', 'warning') else 'bg-emerald-50 text-emerald-800 border border-emerald-200' }}">
                  {{ msg }}
                </div>
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}

        <form method="POST" action="/login" class="space-y-4">
            <input type="hidden" name="next" value="{{ next_url }}">
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Username</label>
                <input type="text" name="username" required autofocus autocomplete="username"
                       class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <div>
                <label class="block text-xs font-semibold text-slate-600 uppercase mb-1">Password</label>
                <input type="password" name="password" required autocomplete="current-password"
                       class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
            <label class="flex items-center gap-2 text-xs text-slate-600 cursor-pointer">
                <input type="checkbox" name="remember_me" checked class="w-4 h-4 rounded text-indigo-600 border-slate-300">
                <span>Keep me signed in for 7 days</span>
            </label>
            <button type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg text-sm transition shadow-sm">
                Sign In
            </button>
        </form>
    </div>
</body>
</html>
